name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test dist generation
        run: bash scripts/test-generate-dist.sh

      - name: Build dist bundle
        run: make dist

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate ./

      - name: Verify expected build output
        run: |
          test -d dist/agents/.agents/skills
          test -f dist/agents/.agents/skills/debian-packaging/doc/debian-packaging-main.md

  sync-dist:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build dist bundle
        run: make dist

      - name: Commit regenerated dist
        run: |
          if [[ -z "$(git status --porcelain -- dist)" ]]; then
            echo "dist is current"
            exit 0
          fi
          git add dist
          git commit -m "Update generated bundles"
          git push
